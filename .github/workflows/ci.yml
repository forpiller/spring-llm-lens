name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install parent POM
        run: mvn install -N --no-transfer-progress

      - name: Build and test starter
        run: mvn test -pl spring-llm-lens-starter --no-transfer-progress

      - name: Compile showcase
        run: mvn compile -pl llm-lens-showcase --no-transfer-progress
