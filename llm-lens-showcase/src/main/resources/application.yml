spring:
  application:
    name: llm-lens-showcase
  main:
    web-application-type: servlet
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: hermes3

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,beans,loggers
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

llm:
  lens:
    default-feature: showcase
    pricing:
      models:
        hermes3:
          input-per-million-tokens: 0.10
          output-per-million-tokens: 0.20
